[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electropatch"
version = "0.1.0"
description = "Reproducible scoring of protein-DNA interface decoys"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Sthitadhi Maiti"}]
dependencies = ["numpy>=1.23", "scipy>=1.9", "matplotlib>=3.5"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3,<2"]

[project.scripts]
electropatch = "electropatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
